name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (crypto + commit-reveal)
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend — syntax + imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile all modules
        run: python -m compileall -q .
      - name: Import the app + verify API surface
        run: |
          APP_ENV=dev python -c "
          import server, auth, state_store
          paths = sorted(server.app.openapi()['paths'].keys())
          print('\n'.join(paths))
          assert '/api/wallet/evidence/anchor' in paths
          assert '/api/evidence/verify' in paths
          assert '/api/state' in paths
          print('API surface OK')
          "

  contracts:
    name: Contracts — compile + test (in-process Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      - name: Compile (solidity 0.8.28, viaIR)
        run: npx hardhat compile
      - name: Test suite (commit-reveal, escrow, registry, hub)
        run: npx hardhat test
