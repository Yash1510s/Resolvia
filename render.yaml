services:
  # ─── FastAPI Backend & AI Advisory ───
  - type: web
    name: resolvia-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install google-genai httpx slowapi
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RESOLVIA_RPC
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: RESOLVIA_CHAIN_ID
        value: "11155111"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
