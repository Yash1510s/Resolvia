services:
  # ─── FastAPI Backend & AI Advisory ───
  - type: web
    name: resolvia-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install google-genai httpx slowapi
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # ── Non-sensitive config (safe to commit) ──
      - key: APP_ENV
        value: prod
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RESOLVIA_RPC
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: RESOLVIA_CHAIN_ID
        value: "11155111"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      # ── Secrets (set these in Render Dashboard → Environment) ──
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false


  # ─── Next.js 16 Frontend ───
  - type: web
    name: resolvia-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_NETWORK
        value: sepolia
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "11155111"
      - key: NEXT_PUBLIC_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      # ── Set these in Render Dashboard → Environment ──
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GITHUB_CLIENT_ID
        sync: false
      - key: RESOLVIA_BACKEND_URL
        value: https://resolvia-3yau.onrender.com
